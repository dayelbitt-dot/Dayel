<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Meu Assistente</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Tela de carregamento -->
  <div id="splash" class="splash">
    <div class="splash-logo">✦</div>
    <p>Carregando seu assistente…</p>
  </div>

  <!-- Tela de login -->
  <section id="auth-view" class="auth-view hidden">
    <div class="auth-card">
      <div class="brand"><span class="brand-mark">✦</span> Meu Assistente</div>
      <p class="auth-sub">Sua vida pessoal e profissional organizada em um só lugar.</p>

      <div id="auth-mode-cloud" class="auth-body hidden">
        <div class="tabs">
          <button class="tab active" data-tab="login">Entrar</button>
          <button class="tab" data-tab="signup">Criar conta</button>
        </div>
        <form id="auth-form">
          <label>E-mail
            <input type="email" id="auth-email" autocomplete="email" required placeholder="voce@email.com" />
          </label>
          <label>Senha
            <input type="password" id="auth-password" autocomplete="current-password" required minlength="6" placeholder="mínimo 6 caracteres" />
          </label>
          <button type="submit" class="btn btn-primary" id="auth-submit">Entrar</button>
          <p class="auth-msg" id="auth-msg"></p>
        </form>
      </div>

      <div id="auth-mode-local" class="auth-body">
        <div class="notice">
          <strong>Modo local ativo.</strong>
          <span>Seus dados estão salvos só neste aparelho. Para usar login e sincronizar entre celular e computador, configure a nuvem (Supabase) — veja o README.</span>
        </div>
        <button class="btn btn-primary" id="enter-local">Começar a usar</button>
      </div>
    </div>
  </section>

  <!-- App principal -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">✦</span> Meu Assistente</div>
      <div class="topbar-actions">
        <span id="user-chip" class="user-chip"></span>
        <button id="logout-btn" class="icon-btn" title="Sair">⎋</button>
      </div>
    </header>

    <main id="main" class="main"></main>

    <nav class="tabbar">
      <button class="tabbar-btn active" data-route="dashboard"><span>🏠</span>Início</button>
      <button class="tabbar-btn" data-route="personal"><span>🧑</span>Pessoal</button>
      <button class="tabbar-btn" data-route="professional"><span>💼</span>Trabalho</button>
      <button class="tabbar-btn" data-route="notes"><span>📝</span>Notas</button>
    </nav>
  </div>

  <!-- Modal genérico -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal" id="modal"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
