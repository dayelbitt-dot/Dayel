<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f1ec" />
  <title>Meu Assistente</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Ícones de traço fino (usados na barra de navegação) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/></symbol>
      <symbol id="i-cal" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2.5"/><path d="M4 9.5h16M8.5 3v4M15.5 3v4"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16.5 5.2a3.2 3.2 0 0 1 0 6M21 20a6 6 0 0 0-3.8-5.6"/></symbol>
      <symbol id="i-scale" viewBox="0 0 24 24"><path d="M12 4.5V20M8 20h8M4.5 7.5h15"/><path d="M8 7.5l-3 5.5h6l-3-5.5ZM16 7.5l-3 5.5h6l-3-5.5Z"/><circle cx="12" cy="4.3" r="1.3"/></symbol>
      <symbol id="i-doc" viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 13h4M10 16.5h4"/></symbol>
      <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 9.5a6 6 0 0 1 12 0c0 4.5 2 5.5 2 5.5H4s2-1 2-5.5"/><path d="M10 19.5a2 2 0 0 0 4 0"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/></symbol>
      <symbol id="i-briefcase" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12.5h18"/></symbol>
      <symbol id="i-note" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M9 9h6M9 13h6M9 17h4"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></symbol>
      <symbol id="i-clip" viewBox="0 0 24 24"><path d="M20 11.5l-8.4 8.4a5 5 0 0 1-7.1-7.1l8.9-8.9a3.4 3.4 0 0 1 4.8 4.8l-8.8 8.8a1.8 1.8 0 0 1-2.5-2.5l7.9-7.9"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M12 2c.55 4.3 1.7 5.45 6 6-4.3.55-5.45 1.7-6 6-.55-4.3-1.7-5.45-6-6 4.3-.55 5.45-1.7 6-6Z"/></symbol>
    </defs>
  </svg>

  <!-- Tela de carregamento -->
  <div id="splash" class="splash">
    <div class="splash-logo">✦</div>
    <p>Carregando seu assistente…</p>
  </div>

  <!-- Tela de login -->
  <section id="auth-view" class="auth-view hidden">
    <div class="auth-card">
      <div class="brand"><span class="brand-mark">✦</span> Meu Assistente</div>
      <p class="auth-sub">Sua vida pessoal e profissional organizada em um só lugar.</p>

      <div id="auth-mode-cloud" class="auth-body hidden">
        <div class="tabs">
          <button class="tab active" data-tab="login">Entrar</button>
          <button class="tab" data-tab="signup">Criar conta</button>
        </div>
        <form id="auth-form">
          <label>E-mail
            <input type="email" id="auth-email" autocomplete="email" required placeholder="voce@email.com" />
          </label>
          <label>Senha
            <input type="password" id="auth-password" autocomplete="current-password" required minlength="6" placeholder="mínimo 6 caracteres" />
          </label>
          <button type="submit" class="btn btn-primary" id="auth-submit">Entrar</button>
          <p class="auth-msg" id="auth-msg"></p>
        </form>
      </div>

      <div id="auth-mode-local" class="auth-body">
        <div class="notice">
          <strong>Modo local ativo.</strong>
          <span>Seus dados estão salvos só neste aparelho. Para usar login e sincronizar entre celular e computador, configure a nuvem (Supabase) — veja o README.</span>
        </div>
        <button class="btn btn-primary" id="enter-local">Começar a usar</button>
      </div>
    </div>
  </section>

  <!-- App principal -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">✦</span> Meu Assistente</div>
      <div class="topbar-actions">
        <span id="user-chip" class="user-chip"></span>
        <button id="logout-btn" class="icon-btn" title="Sair">⎋</button>
      </div>
    </header>

    <main id="main" class="main"></main>

    <nav class="tabbar">
      <button class="tabbar-btn active" data-route="dashboard"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-home"/></svg>Início</button>
      <button class="tabbar-btn" data-route="agenda"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-cal"/></svg>Agenda</button>
      <button class="tabbar-btn" data-route="clients"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-users"/></svg>Clientes</button>
      <button class="tabbar-btn" data-route="processes"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-scale"/></svg>Processos</button>
      <button class="tabbar-btn" data-route="docs"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-doc"/></svg>Documentos</button>
      <button class="tabbar-btn" data-route="reminders"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-bell"/></svg>Lembretes</button>
      <button class="tabbar-btn" data-route="personal"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-user"/></svg>Pessoal</button>
      <button class="tabbar-btn" data-route="professional"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-briefcase"/></svg>Trabalho</button>
      <button class="tabbar-btn" data-route="notes"><svg class="tab-ico" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-note"/></svg>Notas</button>
    </nav>
  </div>

  <!-- Modal genérico -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal" id="modal"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
